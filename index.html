<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ed087d"><title>ALBAROKAH CELL</title>
<style>
:root{--p:#ed087d;--h:#ff168f;--o:#ff641d;--v:#7957ff;--c:#42d7e9;--ink:#241724;--muted:#796978;--paper:#fff7fc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 0 0,#ffd0e8 0,transparent 35%),radial-gradient(ellipse at 100% 15%,#ffe0ca 0,transparent 30%),linear-gradient(145deg,#fff7fc,#fff 55%,#fff0f8);min-height:100vh}
button{font:inherit;cursor:pointer}.page{display:none;min-height:100vh;padding:20px 17px 35px}.page.active{display:block;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.wrap{max-width:720px;margin:auto}
.brand{font-weight:950;letter-spacing:.13em;font-size:17px;background:linear-gradient(90deg,var(--p),var(--o),var(--v));color:transparent;background-clip:text}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.pill{border:1px solid #ed087d33;background:#fffC;color:var(--p);padding:8px 12px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.08em}
.hero{text-align:center;padding:18px 5px 24px;position:relative}.logo{width:145px;height:145px;margin:0 auto 17px;border-radius:28px;overflow:hidden;background:white;border:5px solid white;box-shadow:0 17px 42px #65123d24;transform:rotate(-2deg)}.logo img{width:100%;height:100%;object-fit:cover}.kicker{font-size:10px;letter-spacing:.22em;color:var(--o);font-weight:900;text-transform:uppercase}h1{font-size:clamp(27px,7vw,39px);line-height:1.05;letter-spacing:-.05em;margin:9px 0;font-weight:950}.tag{font-size:14px;color:var(--muted);margin:0}.heading{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 13px;font-size:13px}.heading small{color:var(--muted);font-size:10px}
.prices{display:grid;gap:10px}.price{position:relative;min-height:62px;width:100%;border:1px solid #ed087d20;border-radius:18px;background:linear-gradient(100deg,#fff,#fff0f8 60%,#fff);box-shadow:0 8px 20px #7e1e530e;color:#342032;font-weight:900;font-size:17px;letter-spacing:.04em}.price:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:18px 0 0 18px;background:linear-gradient(var(--p),var(--o),var(--v))}.price:active{transform:scale(.985)}.foot{text-align:center;color:#9a8796;font-size:10px;margin:20px 0}
.back{border:0;background:white;color:var(--p);font-weight:850;border-radius:99px;padding:10px 14px;box-shadow:0 5px 16px #46103212}.range{font-size:11px;font-weight:900;color:white;background:linear-gradient(90deg,var(--p),var(--o));padding:8px 12px;border-radius:99px}.title{font-size:27px;font-weight:950;letter-spacing:-.04em;margin:18px 0 3px}.sub{font-size:12px;color:var(--muted);margin:0}.flow{margin:15px -17px 3px;min-height:325px;display:flex;align-items:center;justify-content:center;perspective:1100px;touch-action:pan-y;position:relative;overflow:hidden}.flow:before{content:"";position:absolute;width:270px;height:210px;border-radius:50%;background:radial-gradient(ellipse,#ff62b155,#ff641d18 55%,transparent 72%);filter:blur(10px)}.stage{width:100%;height:315px;position:relative;transform-style:preserve-3d}.card{position:absolute;left:50%;top:50%;width:min(61vw,245px);height:286px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.75,.2,1),opacity .35s;will-change:transform,opacity;border-radius:27px;background:linear-gradient(145deg,#fff,#fff0f8);border:1px solid white;box-shadow:0 24px 48px #4c143a29;overflow:hidden;display:flex;align-items:center;justify-content:center}.card img{width:100%;height:100%;object-fit:contain;padding:12px}.device{width:105px;height:210px;border:5px solid #29232e;border-radius:25px;background:linear-gradient(145deg,#fff,#d8d2df);box-shadow:inset 0 0 0 2px white,0 16px 25px #200a1e30;position:relative}.device:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:34px;height:8px;border-radius:8px;background:#29232e}.device:after{content:"";position:absolute;top:23px;left:10px;width:30px;height:30px;border-radius:9px;background:#444;box-shadow:39px 0 0 -4px #555,0 39px 0 -4px #555}.flowinfo{text-align:center;padding:0 8px}.model{font-size:22px;font-weight:950;letter-spacing:-.04em}.spec{font-size:13px;color:var(--muted);font-weight:700;margin:7px}.money{font-size:25px;font-weight:950;background:linear-gradient(90deg,var(--p),var(--o));color:transparent;background-clip:text}.condition,.meta{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:99px;background:white;border:1px solid #ed087d26;color:var(--p);font-size:10px;font-weight:900;letter-spacing:.08em}.hint{text-align:center;color:#a18d9d;font-size:10px;margin-top:13px}.empty{text-align:center;padding:25px 17px;border:1px dashed #ed087d66;border-radius:19px;background:#ffffffb8;color:var(--muted);font-size:13px;margin-top:24px}
.gallery{display:grid;grid-template-columns:1.12fr .88fr;grid-template-rows:150px 150px 105px;gap:9px;margin-top:17px}.shot{border-radius:19px;overflow:hidden;background:linear-gradient(145deg,#fff,#ffe4f2 65%,#ffe1d2);border:1px solid white;box-shadow:0 10px 25px #60174414;display:flex;align-items:center;justify-content:center}.shot:first-child{grid-row:1/span 2}.shot:last-child{grid-column:1/-1}.shot img{width:100%;height:100%;object-fit:contain;padding:9px}.mini-device{width:58px;height:105px;border:4px solid #514656;border-radius:15px;background:linear-gradient(145deg,#fff,#dcd3e1);position:relative}.mini-device:before{content:"";position:absolute;top:8px;left:8px;width:17px;height:17px;border-radius:6px;background:#61576a;box-shadow:21px 0 0 -3px #61576a,0 21px 0 -3px #61576a}
.dname{font-size:27px;line-height:1.08;letter-spacing:-.05em;font-weight:950;margin:20px 0 6px}.dprice{font-size:30px;font-weight:950;background:linear-gradient(90deg,var(--p),var(--o),var(--v));color:transparent;background-clip:text}.section{padding:16px 0;border-top:1px solid #47183b18}.section h3{font-size:12px;letter-spacing:.08em;margin:0 0 10px;font-weight:950}.section p{font-size:14px;font-weight:750;color:#6d5869;margin:0}.bullets{padding-left:18px;margin:0;color:#665565;font-size:13px;line-height:1.65}.wa{width:100%;border:0;border-radius:17px;padding:16px;color:white;font-weight:950;background:linear-gradient(100deg,var(--p),#ff3b9e,var(--o));box-shadow:0 13px 28px #ed087d40}.detailback{margin-top:3px}
@media(min-width:600px){.page{padding-left:28px;padding-right:28px}.flow{margin-left:-28px;margin-right:-28px}.gallery{grid-template-rows:210px 210px 145px}.card{height:330px;width:250px}.stage{height:360px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
