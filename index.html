<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e5007d"><title>ALBAROKAH CELL</title><style>
:root{--p:#e5007d;--p2:#ff3295;--ink:#25232b;--muted:#74727b;--line:#eee8ee;--soft:#fff2f8}*{box-sizing:border-box}body{margin:0;background:#f5f3f6;color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-weight:450}.app{max-width:480px;min-height:100dvh;margin:auto;background:#fff;box-shadow:0 0 40px #0001}button{font:inherit;cursor:pointer}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #f2edf2;position:sticky;top:0;background:white;z-index:5}.brand{font-size:16px;font-weight:750;letter-spacing:.4px}.iconbtn{border:0;background:none;color:var(--ink);font-size:23px;padding:6px}.page{display:none;padding:20px 18px 30px;min-height:calc(100dvh - 62px)}.page.active{display:block}.logo{height:135px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.logo img{max-width:175px;max-height:130px;object-fit:contain}.fallback{display:none;border:2px solid var(--p);border-radius:50%;width:115px;height:115px;align-items:center;justify-content:center;text-align:center;color:var(--p);font-size:12px;font-weight:750}.tagline{text-align:center;font-size:19px;font-weight:650;margin:12px 0 22px}.prices{display:flex;flex-direction:column;gap:11px}.priceitem{min-height:66px;width:100%;border:1px solid #f1b5d3;border-radius:17px;background:white;color:var(--ink);font-size:17px;font-weight:650;text-align:center;display:flex;align-items:center;justify-content:center;transition:.15s}.priceitem:active,.priceitem:hover{border-color:var(--p);background:var(--soft)}.unitphotos{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:9px;height:min(58vh,450px);min-height:330px;margin-bottom:16px}.photo{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#f7d8e9,#d9d4f1 48%,#f5f2f6);display:flex;align-items:center;justify-content:center}.photo.big{grid-row:1/3}.photo img{width:100%;height:100%;object-fit:cover;display:none}.photo img.loaded{display:block}.phoneart{height:72%;width:44%;border-radius:27px;background:linear-gradient(145deg,#c8bafa,#907fe6);box-shadow:0 14px 26px #42357c40;border:3px solid #ffffffa0;position:relative}.phoneart:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:23px;height:23px;background:#292438;border-radius:50%}.caption{position:absolute;bottom:8px;left:8px;font-size:10px;color:#5b5267;background:#ffffffa8;padding:4px 7px;border-radius:8px}.model{font-size:21px;font-weight:720;margin:0 0 5px}.ram{font-size:15px;color:var(--muted);font-weight:600}.productprice{font-size:19px;font-weight:700;color:var(--p);margin:10px 0 4px}.condition{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.4px}.nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:white;font-size:22px;color:var(--p)}.counter{font-size:14px;color:var(--muted);font-weight:600}.gallery{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:115px 115px 88px;gap:8px;margin-bottom:16px}.gallery .g1{grid-row:1/3}.gallery .g4{grid-column:1/3}.gallery .photo{min-height:0}.detailtitle{font-size:21px;font-weight:720;margin:14px 0 6px}.meta{font-size:14px;color:var(--muted);font-weight:550;display:flex;gap:12px;flex-wrap:wrap}.detailprice{font-size:20px;color:var(--p);font-weight:700;margin:10px 0 5px}.section{border-top:1px solid var(--line);padding:13px 0}.sectitle{font-size:14px;font-weight:700;margin-bottom:7px;color:var(--p)}.bodytext{font-size:14px;line-height:1.55;color:#333}ul{margin:4px 0;padding-left:19px}.whatsapp{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;background:linear-gradient(110deg,var(--p),var(--p2));color:white;font-size:16px;font-weight:700;padding:16px;margin:18px 0 5px;box-shadow:0 8px 18px #e5007d30}.back{color:var(--p)}
</style></head><body><div class="app"><header><button class="iconbtn back" id="back" style="display:none">‹</button><div class="brand" id="brand">ALBAROKAH CELL</div><button class="iconbtn" id="menu">☰</button></header><main>
<section class="page active" id="home"><div class="logo"><img src="logo.png" alt="Logo ALBAROKAH CELL" onerror="this.style.display='none';document.querySelector('.fallback').style.display='flex'"><div class="fallback">LOGO<br>ALBAROKAH<br>CELL</div></div><div class="tagline">Temukan HP pilihan Anda.</div><div class="prices" id="prices"></div></section>
<section class="page" id="units"><div class="unitphotos" id="unitphotos"></div><h1 class="model" id="model"></h1><div class="ram" id="ram"></div><div class="productprice" id="price"></div><div class="condition" id="condition"></div><div class="nav"><button id="prev">‹</button><span class="counter" id="counter"></span><button id="next">›</button></div></section>
<section class="page" id="detail"><div class="gallery" id="gallery"></div><h1 class="detailtitle" id="dmodel"></h1><div class="meta"><span id="dram"></span><span id="dcondition"></span></div><div class="detailprice" id="dprice"></div><div class="section"><div class="sectitle">Colors</div><div class="bodytext" id="colors"></div></div><div class="section" id="completenessSection"><div class="sectitle">Kelengkapan</div><div class="bodytext" id="completeness"></div></div><div class="section"><div class="sectitle">Nilai plus</div><div class="bodytext"><ul id="plus"></ul></div></div><div class="section" id="optimalSection"><div class="sectitle">Belum optimal</div><div class="bodytext"><ul id="optimal"></ul></div></div><button class="whatsapp" id="wa">◉ &nbsp; Tanya Unit Ini</button></section></main></div>
<script>
// EDIT/TAMBAHKAN DATA HP DI SINI. Masukkan URL foto asli pada photos (maksimal 4).
// completeness ditampilkan hanya untuk kondisi 2ND.
const ranges=["1.000–1.500","1.600–2.000","2.100–2.500","2.600–3.000","3.100–3.500","3.600–4.000","4.100–4.500","4.600–5.000","5.100–5.500","5.600–6.000","6.100–6.500","6.600–7.000","7.100–7.500","7.600–8.000","8.100–8.500"];
const products=[{range:0,model:"Contoh Model HP",ram:"4/64 GB",price:"1.499.000",condition:"NEW",colors:"Purple · Black · Blue",completeness:"",plus:["Large battery","Smooth daily performance"],optimal:["No NFC"],photos:[]},{range:0,model:"Contoh Unit 2ND",ram:"6/128 GB",price:"1.450.000",condition:"2ND",colors:"Black · Blue",completeness:"HP · Dus · Kabel · SIM ejector",plus:["Good everyday performance","Comfortable display"],optimal:["Minor cosmetic signs"],photos:[]}];let range=0,index=0;const pageids=["home","units","detail"];
function page(name){pageids.forEach(x=>document.getElementById(x).classList.toggle("active",x===name));document.getElementById("back").style.display=name==="home"?"none":"block";document.getElementById("menu").style.display=name==="home"?"none":"block";if(name==="units")renderUnit();if(name==="detail")renderDetail()}
function renderPrices(){ranges.forEach((r,i)=>{let b=document.createElement("button");b.className="priceitem";b.textContent=r;b.onclick=()=>{range=i;index=0;page("units")};document.getElementById("prices").appendChild(b)})}
function tile(url,cls=""){return `<div class="photo ${cls}">${url?`<img src="${url}" onload="this.classList.add('loaded')" onerror="this.remove()">`:`<div class="phoneart"></div>`}</div>`}function list(){return products.filter(x=>x.range===range)}function current(){return list()[index]}
function renderUnit(){let a=list();if(!a.length){document.getElementById("unitphotos").innerHTML=tile()+tile()+tile();document.getElementById("model").textContent="Belum ada unit di rentang ini";["ram","price","condition"].forEach(x=>document.getElementById(x).textContent="");document.getElementById("counter").textContent="0 / 0";return}index=Math.max(0,Math.min(index,a.length-1));let p=current();document.getElementById("unitphotos").innerHTML=tile(p.photos[0],"big")+tile(p.photos[1])+tile(p.photos[2]);document.getElementById("model").textContent=p.model;document.getElementById("ram").textContent=p.ram;document.getElementById("price").textContent=p.price;document.getElementById("condition").textContent=p.condition;document.getElementById("counter").textContent=`${index+1} / ${a.length}`}
function renderDetail(){let p=current();if(!p)return;document.getElementById("gallery").innerHTML=tile(p.photos[0],"g1")+tile(p.photos[1])+tile(p.photos[2])+tile(p.photos[3],"g4");document.getElementById("dmodel").textContent=p.model;document.getElementById("dram").textContent=p.ram;document.getElementById("dcondition").textContent=p.condition;document.getElementById("dprice").textContent=p.price;document.getElementById("colors").textContent=p.colors||"—";document.getElementById("completenessSection").style.display=p.condition==="2ND"?"block":"none";document.getElementById("completeness").textContent=p.completeness||"—";document.getElementById("plus").innerHTML=(p.plus||[]).map(x=>`<li>${x}</li>`).join("");document.getElementById("optimalSection").style.display=(p.optimal||[]).length?"block":"none";document.getElementById("optimal").innerHTML=(p.optimal||[]).map(x=>`<li>${x}</li>`).join("")}
document.getElementById("prev").onclick=()=>{let a=list();if(a.length){index=(index-1+a.length)%a.length;renderUnit()}};document.getElementById("next").onclick=()=>{let a=list();if(a.length){index=(index+1)%a.length;renderUnit()}};document.getElementById("unitphotos").onclick=()=>page("detail");document.getElementById("back").onclick=()=>page(document.getElementById("detail").classList.contains("active")?"units":"home");document.getElementById("menu").onclick=()=>page("home");document.getElementById("wa").onclick=()=>{let p=current();let msg=encodeURIComponent(`Halo, saya tertarik dengan ${p.model} (${p.ram}, ${p.condition}) seharga ${p.price}. Apakah unitnya masih tersedia?`);window.open("https://wa.me/?text="+msg,"_blank")};renderPrices();
</script></body></html>
